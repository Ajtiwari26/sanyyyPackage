name: Build Windows Installer (SanyyySetup.exe)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔨 Build Sanyyy.exe with PyInstaller
        run: |
          python builder/build_windows_exe.py

      - name: ⚙️ Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: 📦 Compile SanyyySetup.exe Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" builder/inno_setup_script.iss

      - name: ⬆️ Upload SanyyySetup.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanyyySetup-Windows-Installer
          path: output/SanyyySetup.exe
          retention-days: 90

      - name: 🚀 Create GitHub Release & Attach SanyyySetup.exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          name: 🌸 Sanyyy AI Windows Installer v2.0.0
          tag_name: v2.0.0
          draft: false
          prerelease: false
          files: output/SanyyySetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
